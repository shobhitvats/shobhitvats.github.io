name: Generate PDF Portfolio

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'export-portfolio-to-pdf.mjs'
      - '.github/workflows/generate-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local server and generate PDF
        run: |
          python3 -m http.server 8080 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done
          BASE=http://127.0.0.1:8080 node export-portfolio-to-pdf.mjs

      - name: Upload generated PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-full-pdf
          path: portfolio-full.pdf
          retention-days: 30
